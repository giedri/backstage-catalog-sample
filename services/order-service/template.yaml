AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Order management microservice - Lambda/API Gateway/DynamoDB

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        LOG_LEVEL: INFO
        STACK_NAME: !Ref AWS::StackName
        TABLE_NAME: !Ref OrderTable
        PAGINATION_SECRET: !Ref PaginationSecret
    Architectures:
      - arm64

Parameters:
  CognitoDomain:
    Type: String
    Default: order-service-auth
    Description: Cognito hosted UI domain prefix
  PaginationSecret:
    Type: String
    NoEcho: true
    Default: change-me-in-production
    Description: HMAC secret used to sign pagination tokens

Resources:
  # ---------- Cognito ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
      UserPoolTags:
        Service: !Ref AWS::StackName

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClientGrantTypes:
        - authorization_code
      CallbackURLs:
        - http://localhost:3000/callback
      LogoutURLs:
        - http://localhost:3000/logout

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${CognitoDomain}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Administrators with elevated privileges (e.g., update order status)
      UserPoolId: !Ref UserPool

  # ---------- API Gateway ----------
  OrderApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            AuthorizationScopes:
              - openid
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              audience:
                - !Ref UserPoolClient
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS

  # ---------- DynamoDB ----------
  OrderTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-orders"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: !Ref AWS::StackName

  # ---------- Lambda Functions ----------
  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.create_order.lambda_handler
      CodeUri: .
      Description: Creates a new order
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrderTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /v1/orders
            Method: POST

  GetOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.get_order.lambda_handler
      CodeUri: .
      Description: Retrieves an order by ID
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrderTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /v1/orders/{orderId}
            Method: GET

  ListOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.list_orders.lambda_handler
      CodeUri: .
      Description: Lists orders with pagination
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrderTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /v1/orders
            Method: GET

  UpdateOrderStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.update_order_status.lambda_handler
      CodeUri: .
      Description: Updates order status
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrderTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /v1/orders/{orderId}/status
            Method: PATCH

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.handlers.health.lambda_handler
      CodeUri: .
      Description: Health check endpoint
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${OrderApi}.execute-api.${AWS::Region}.amazonaws.com"
  OrderTableName:
    Description: DynamoDB table name
    Value: !Ref OrderTable
  OrderTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt OrderTable.Arn
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  UserPoolDomain:
    Description: Cognito hosted UI domain
    Value: !Sub "https://${CognitoDomain}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
